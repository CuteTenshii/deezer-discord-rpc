name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            build-os: linux
            artifacts: |
              dist/*.deb
              dist/*.AppImage
              dist/*.AppImage.zsync
              dist/*.rpm
              dist/*.snap
          - os: windows-latest
            build-os: windows
            artifacts: dist/*.exe
          - os: macos-latest
            build-os: macos
            artifacts: dist/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          bun run tsc
          bun run copy-assets
          bun scripts/build.js ${{ matrix.build-os }}

      # AppImage update tools download this to fetch only the blocks that changed.
      - name: Generate AppImage zsync file
        if: matrix.build-os == 'linux'
        working-directory: dist
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync
          for appimage in *.AppImage; do
            zsyncmake -u "$appimage" -o "$appimage.zsync" "$appimage"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ matrix.artifacts }}
          name: ${{ runner.os }}-artifacts
          if-no-files-found: error
